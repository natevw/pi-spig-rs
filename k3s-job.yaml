#   [paste in, then ^D]
# kubectl logs job/pi-calc --all-pods=true
# kubectl get pods -o wide

# kubectl run -it --rm test --image=busybox
#   apt update; apt install iputils-ping
#   ping pi-calc-0.calculators


apiVersion: v1
kind: Service
metadata:
  name: calculators
spec:
  clusterIP: None  # (headless)
  selector:
    job-name: pi-calc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pi-calc
spec:
  completions: 4  # should be `NUM_WORKERS + 2`
  parallelism: 4  # must match `completions`
  completionMode: Indexed
  template:
    spec:
      # via https://kubernetes.io/docs/tasks/job/job-with-pod-to-pod-communication/
      subdomain: calculators
      restartPolicy: Never
      nodeSelector:
        localreg: ready
      containers:
        - name: worker
          image: turing-node-x.lan:5000/spig
          command: ["/bin/sh", "-c"]
          args:
            - |
              # INDEX:
              # 0 — output
              # … — worker
              # N — zeroes
              
              # HACK: each worker depends on the prior being ready already
              sleep $(( INDEX * 2 ))
              
              piPort=31415
              prevHost="pi-calc-$(( INDEX - 1 )).calculators"
              if [ "$INDEX" -eq 0 ]; then
                exec /app/output $piPort
              elif [ "$INDEX" -eq "$(( NUM_WORKERS + 1 ))" ]; then
                totalWorkSize=$(( DIGITS_PER_WORKER * NUM_WORKERS ))
                exec /app/zeroes $prevHost:$piPort $totalWorkSize
              else
                workSize=$DIGITS_PER_WORKER
                workIdx=$(( INDEX - 1 ))
                workOffset=$(( workIdx * workSize ))
                exec /app/worker $prevHost:$piPort $piPort $workOffset $workSize
              fi
          env:
            - name: NUM_WORKERS
              value: "2"
            - name: DIGITS_PER_WORKER
              value: "42"
            - name: INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
